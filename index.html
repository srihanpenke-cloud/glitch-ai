      <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G.L.I.T.C.H. - System Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030305;
      color: #00ffff;
      font-family: 'Courier Prime', 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 800px;
      margin: 0 auto;
      padding: 12px;
    }

    /* Solo Leveling System Window Style */
    header {
      background: rgba(0, 20, 40, 0.85);
      border: 2px solid #00ffff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
      text-align: center;
      padding: 10px;
      margin-bottom: 10px;
      position: relative;
    }

    header::before, header::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border: 2px solid #00ffff;
    }
    header::before { top: -4px; left: -4px; }
    header::after { top: -4px; right: -4px; }

    header h1 {
      color: #00ffff;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }

    header .subtitle {
      color: #80ffff;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      font-weight: 700;
    }

    .api-key-box {
      margin-bottom: 8px;
    }

    .api-key-box input {
      width: 100%;
      background-color: rgba(0, 10, 20, 0.9);
      border: 1px solid #00ffff;
      color: #00ffff;
      font-family: 'Courier Prime', 'Courier New', monospace;
      padding: 6px 10px;
      font-size: 0.8rem;
      outline: none;
      box-shadow: inset 0 0 5px rgba(0, 255, 255, 0.2);
    }

    /* Fixed layout so chat area scrolls internally and input stays pinned */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px;
      background: rgba(0, 5, 10, 0.6);
      border: 1px dashed rgba(0, 255, 255, 0.3);
      margin-bottom: 10px;
      min-height: 0;
    }

    .message {
      padding: 10px 14px;
      border-radius: 2px;
      max-width: 85%;
      word-break: break-word;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }

    .message.user {
      align-self: flex-end;
      background-color: rgba(0, 255, 255, 0.15);
      border: 1px solid #00ffff;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 0 5px rgba(0, 255, 255, 0.2);
    }

    .message.model {
      align-self: flex-start;
      background-color: rgba(0, 10, 20, 0.9);
      border: 2px solid #00ffff;
      color: #00ffff;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    #input-container {
      display: flex;
      gap: 6px;
    }

    #user-input {
      flex: 1;
      background-color: rgba(0, 10, 20, 0.9);
      border: 1px solid #00ffff;
      color: #00ffff;
      font-family: 'Courier Prime', 'Courier New', monospace;
      padding: 10px;
      font-size: 0.95rem;
      outline: none;
      box-shadow: inset 0 0 5px rgba(0, 255, 255, 0.2);
    }

    #user-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
    }

    button {
      background-color: rgba(0, 255, 255, 0.2);
      color: #00ffff;
      border: 1px solid #00ffff;
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-weight: bold;
      padding: 10px 14px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #00ffff;
      color: #030305;
      box-shadow: 0 0 10px #00ffff;
    }

    button.recording {
      background-color: #ff0055;
      border-color: #ff0055;
      color: #ffffff;
      box-shadow: 0 0 10px #ff0055;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>[SYSTEM: G.L.I.T.C.H.]</h1>
    <p class="subtitle">Gamer Linked Intelligent Tactical Control Host</p>
  </header>

  <div class="api-key-box">
    <input type="password" id="api-key" placeholder="Enter Free Gemini API Key..." />
  </div>

  <div id="chat-container">
    <div class="message model">[Notice] System fully initialized. Voice input & chat memory active. Ready for command.</div>
  </div>

  <form id="input-container" onsubmit="event.preventDefault(); sendMessage(); return false;">
    <input type="text" id="user-input" placeholder="Execute command or ask..." required />
    <button type="button" id="mic-btn" title="Voice Input" onclick="toggleVoiceInput()">MIC</button>
    <button type="submit">SEND</button>
  </form>

  <script>
    const SYSTEM_PROMPT = `
You are G.L.I.T.C.H. (Gamer Linked Intelligent Tactical Control Host), an all-in-one tactical AI assistant styled like a gaming System UI.
PERSONALITY & BEHAVIOR:
- Direct, analytical, slightly sarcastic, highly tactical. Speak with typewriter precision.
- Function as a complete general-purpose AI: provide news, study help, math/science solutions, coding assistance, and general knowledge.
USER PROFILE & CONTEXT:
- Primary Device: iQOO Z6 Lite (Android)
- Gaming Stats: Valorant (Ascendant 1), Rocket League (Grand Champion), Apex Legends (Diamond 2)
`;

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const apiKeyInput = document.getElementById('api-key');
    const micBtn = document.getElementById('mic-btn');

    let contentsHistory = [];

    // Load API key and saved chat history from localStorage
    if (localStorage.getItem('glitch_api_key')) {
      apiKeyInput.value = localStorage.getItem('glitch_api_key');
    }

    if (localStorage.getItem('glitch_chat_history')) {
      try {
        contentsHistory = JSON.parse(localStorage.getItem('glitch_chat_history'));
        // Re-render saved messages (skipping system prompt context items)
        contentsHistory.forEach(item => {
          if (item.parts && item.parts[0]?.text) {
            appendMessageUI(item.role === 'user' ? 'user' : 'model', item.parts[0].text, false);
          }
        });
      } catch (e) {
        console.error("Failed to load chat history", e);
      }
    }

    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('glitch_api_key', apiKeyInput.value.trim());
    });

    function saveHistory() {
      localStorage.setItem('glitch_chat_history', JSON.stringify(contentsHistory));
    }

    function appendMessageUI(role, text, save = true) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', role);
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      if (save) {
        saveHistory();
      }
    }

    // Voice Input Integration using Web Speech API
    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        stopRecordingUI();
      };

      recognition.onerror = () => {
        stopRecordingUI();
      };

      recognition.onend = () => {
        stopRecordingUI();
      };
    }

    function toggleVoiceInput() {
      if (!recognition) {
        alert('Voice input is not supported on this browser/device.');
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
        micBtn.classList.add('recording');
        micBtn.textContent = 'REC';
        isRecording = true;
      }
    }

    function stopRecordingUI() {
      micBtn.classList.remove('recording');
      micBtn.textContent = 'MIC';
      isRecording = false;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!text) return;
      if (!apiKey) {
        alert('Please enter your Google Gemini API Key.');
        return;
      }

      localStorage.setItem('glitch_api_key', apiKey);

      appendMessageUI('user', text);
      contentsHistory.push({ role: 'user', parts: [{ text: text }] });
      userInput.value = '';

      const loadingDiv = document.createElement('div');
      loadingDiv.classList.add('message', 'model');
      loadingDiv.textContent = '[SYSTEM] Processing command...';
      chatContainer.appendChild(loadingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      const candidateModels = ['models/gemini-3.6-flash'];
      let success = false;
      let lastErrorMessage = '';

      for (const modelPath of candidateModels) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/${modelPath}:generateContent?key=${apiKey}`;
          
          let response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
              contents: contentsHistory,
              tools: [{ googleSearch: {} }]
            })
          });

          let data = await response.json();

          if (data.error) {
            lastErrorMessage = data.error.message;
            response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
                contents: contentsHistory
              })
            });
            data = await response.json();
          }

          if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
            if (loadingDiv.parentNode) chatContainer.removeChild(loadingDiv);
            const reply = data.candidates[0].content.parts[0].text;
            appendMessageUI('model', reply);
            contentsHistory.push({ role: 'model', parts: [{ text: reply }] });
            saveHistory();
            success = true;
            break;
          } else if (data.error) {
            lastErrorMessage = data.error.message;
          }
        } catch (err) {
          lastErrorMessage = err.message;
        }
      }

      if (!success) {
        if (loadingDiv.parentNode) chatContainer.removeChild(loadingDiv);
        appendMessageUI('model', '[ERROR] ' + (lastErrorMessage || 'Network connection failed.'), false);
      }
    }
  </script>
</body>
</html>
